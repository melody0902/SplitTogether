name: splittogether
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-local-env.sh}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Run scripts/init-local-env.sh}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Run scripts/init-local-env.sh}
      POSTGRES_TEST_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Run scripts/init-local-env.sh}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/10-create-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
volumes:
  postgres-data:
